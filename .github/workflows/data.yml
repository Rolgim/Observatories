name: Données réelles
# Télécharge de vraies observations (MAST, ESA) et commite les aperçus dans data/.
on:
  workflow_dispatch:
    inputs:
      recettes:
        description: 'Recettes à relancer, séparées par des espaces (vide = toutes)'
        required: false
  push:
    branches: [main]
    paths: ['tools/data/**', '.github/workflows/data.yml']
permissions:
  contents: write
concurrency: { group: data, cancel-in-progress: true }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet astroquery astropy numpy pillow requests pyvo fsspec aiohttp
      - run: python tools/data/fetch_data.py ${{ github.event.inputs.recettes }}
      - run: python tools/data/fetch_orbits.py
      - run: python tools/data/fetch_sky.py
      - name: Commiter les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Données réelles : mise à jour des aperçus"
          git pull --rebase origin main
          git push
