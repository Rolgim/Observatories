name: Sonde
# Lancement manuel : interroge les archives et affiche ce qu'elles exposent (n'écrit rien).
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script de tools/probe à lancer'
        required: true
        default: 'probe_euclid.py'
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet astroquery astropy numpy requests pyvo fsspec aiohttp
      - run: python tools/probe/${{ github.event.inputs.script }}
      # une sonde peut déposer des fichiers dans tools/probe/_out (ex. maquette à examiner) : ils sont gardés 3 jours
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-out, path: tools/probe/_out, retention-days: 3, if-no-files-found: ignore }
