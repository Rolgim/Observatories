name: Sonde
# Lancement manuel : interroge les archives et affiche ce qu'elles exposent (n'écrit rien).
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script de tools/probe à lancer'
        required: true
        default: 'probe_euclid.py'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet astroquery astropy numpy requests pyvo fsspec aiohttp
      - run: python tools/probe/${{ github.event.inputs.script }}
        timeout-minutes: 15        # au-delà, on garde quand même ce que la sonde a écrit
        continue-on-error: true
      # une sonde peut déposer des fichiers dans tools/probe/_out (ex. maquette à examiner) : poussés seuls sur la branche probe-out
      - name: Fichiers de la sonde vers la branche probe-out
        run: |
          [ -d tools/probe/_out ] || exit 0
          cd tools/probe/_out && git init -q -b probe-out && git add -A
          git -c user.name="probe" -c user.email="probe@users.noreply.github.com" commit -q -m "sortie de ${{ github.event.inputs.script }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
