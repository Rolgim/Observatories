<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hubble, JWST, Euclid et Gaia en 3D : pièces cliquables, vue éclatée, comparaison à l'échelle, instruments et archives.">
<title>Observatoires en orbite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>[hidden]{display:none!important}</style>
<style>
/* Parti pris : une fiche technique imprimée (papier gris froid, encre noire, une seule famille de caractères)
   posée à côté d'un hublot noir sur la maquette. Un seul accent : le jaune de surligneur, réservé à « ce qui est sélectionné ». */
:root{
  --paper:#ECEEEF; --sheet:#F7F8F8; --ink:#14171A; --ink-2:#3A4147; --mute:#667077; --rule:#C8CDD1; --rule-2:#98A1A7;
  --mark:#FFD21F; --on-mark:#14171A; --black:#000; --ok:#0B7A4B; --warn:#8A5200; --bad:#B3261E;
  --f:'Archivo', 'Helvetica Neue', Arial, sans-serif; --f-code:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
/* thème sombre : gris anthracite, distinct du noir du ciel */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#1C1F22; --sheet:#262A2E; --ink:#F1F3F4; --ink-2:#C6CCD1; --mute:#939CA3; --rule:#3B4147; --rule-2:#5C656D; --ok:#2FA872; --warn:#E3A33C; --bad:#D9463C; color-scheme:dark; } }
:root[data-theme="dark"]{ --paper:#1C1F22; --sheet:#262A2E; --ink:#F1F3F4; --ink-2:#C6CCD1; --mute:#939CA3; --rule:#3B4147; --rule-2:#5C656D; --ok:#2FA872; --warn:#E3A33C; --bad:#D9463C; color-scheme:dark; }
/* couleurs neutres écrites dans les SVG générés : ramenées aux jetons du thème */
svg [fill="#14171A"]{ fill:var(--ink); } svg [stroke="#14171A"]{ stroke:var(--ink); }
svg [fill="#3A4147"]{ fill:var(--ink-2); } svg [stroke="#3A4147"]{ stroke:var(--ink-2); }
svg [fill="#667077"]{ fill:var(--mute); } svg [stroke="#98A1A7"]{ stroke:var(--rule-2); } svg [stroke="#C8CDD1"]{ stroke:var(--rule); }
svg [fill="#F7F8F8"]{ fill:var(--sheet); } svg [fill="#ECEEEF"]{ fill:var(--paper); }
svg [fill="#FFD21F"][stroke="#14171A"]{ stroke:var(--on-mark); }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body{ height:100%; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--f); font-size:14px; overflow:hidden; }
button{ font-family:inherit; color:inherit; }
button:focus-visible, a:focus-visible, input:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
#stage button:focus-visible, #stage input:focus-visible{ outline-color:#fff; outline-offset:3px; }

#app{ height:100%; display:flex; flex-direction:column; min-height:0; position:relative; }

/* ---------- en-tête ---------- */
#top{ flex:none; display:flex; align-items:stretch; gap:24px; padding-left:var(--gl); padding-right:var(--gr); background:var(--paper); }
.brand{ display:flex; align-items:center; min-width:0; padding-block:11px; }
.brand h1{ font-weight:800; font-stretch:75%; font-size:21px; letter-spacing:.1px; margin:0; white-space:nowrap; }
#tabs{ display:flex; margin-left:auto; overflow-x:auto; scrollbar-width:none; }
#tabs::-webkit-scrollbar{ display:none; }
.tab{ flex:none; border:0; border-left:1px solid var(--rule); background:transparent; color:var(--ink-2); cursor:pointer; padding:0 16px; font-size:14px; font-weight:600; display:flex; align-items:baseline; gap:7px; padding-top:14px; }
.tab small{ font-size:11.5px; font-weight:400; color:var(--mute); font-variant-numeric:tabular-nums; }
.tab:hover{ background:var(--sheet); color:var(--ink); }
.tab[aria-selected="true"]{ background:var(--mark); color:var(--on-mark); }
.tab[aria-selected="true"] small{ color:var(--on-mark); opacity:.75; }
.tab.theme{ align-items:center; padding:0 14px; }
.tab.theme svg{ width:19px; height:19px; display:block; }
.tab.cmp{ border-right:1px solid var(--rule); }

/* ---------- vue 3D ---------- */
#main{ flex:1; display:flex; min-height:0; position:relative; }
#stage{ flex:1; position:relative; min-width:0; min-height:0; background:var(--black); color:#fff; }
#stage canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
#stage canvas.dragging{ cursor:grabbing; }
#stage canvas.over-part{ cursor:pointer; }

.hud{ position:absolute; pointer-events:none; }
#hud-title{ left:var(--gl); top:16px; right:var(--gr); }
#t-name{ font-weight:800; font-stretch:75%; font-size:clamp(24px, 3.4vw, 40px); line-height:1; text-shadow:0 2px 14px #000; }
#t-sub{ color:#C9CED2; font-size:13px; margin-top:7px; text-shadow:0 1px 8px #000; }
#t-src{ color:#8E979D; font-size:11.5px; margin-top:3px; text-shadow:0 1px 8px #000; }

#hover-tip{ position:absolute; pointer-events:none; padding:3px 8px; background:#fff; color:#14171A; font-size:12px; font-weight:600; white-space:nowrap; transform:translate(12px, 14px); z-index:3; }
#callout{ position:absolute; pointer-events:none; transform:translate(-50%, -150%); padding:3px 9px; background:var(--mark); color:var(--on-mark); font-size:12.5px; font-weight:700; white-space:nowrap; z-index:2; }
#callout::after{ content:""; position:absolute; left:50%; top:100%; width:2px; height:12px; margin-left:-1px; background:var(--mark); }
#hint{ position:absolute; left:50%; bottom:calc(66px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); font-size:12px; color:#AEB5BA; pointer-events:none; text-shadow:0 1px 6px #000; white-space:nowrap; transition:opacity .6s; max-width:92%; overflow:hidden; text-overflow:ellipsis; }
#hint.gone{ opacity:0; }

#toolbar{ position:absolute; left:50%; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); display:flex; align-items:stretch; background:var(--paper); color:var(--ink); max-width:calc(100% - 24px); }
.tool{ display:flex; align-items:center; gap:7px; height:38px; padding:0 13px; border:0; border-left:1px solid var(--rule); background:transparent; color:var(--ink); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
.tool svg{ width:16px; height:16px; flex:none; }
.tool:hover{ background:var(--sheet); }
.tool[aria-pressed="true"]{ background:var(--mark); color:var(--on-mark); }
.tool:disabled{ opacity:.35; cursor:default; }
.tool-sep{ display:none; }
.explode{ display:flex; align-items:center; gap:9px; padding:0 13px; height:38px; color:var(--ink); font-size:13px; font-weight:600; }
.explode svg{ width:16px; height:16px; }
.explode input{ width:120px; accent-color:var(--ink); }
.explode input:disabled{ opacity:.5; }

#loader{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(0,0,0,.78); z-index:4; text-align:center; padding:0 24px; }
#loader .l-title{ font-weight:700; font-stretch:75%; font-size:22px; }
#loader .l-sub{ color:#AEB5BA; font-size:12.5px; font-variant-numeric:tabular-nums; max-width:420px; line-height:1.5; }
#loader .bar{ width:min(280px, 70%); height:4px; background:#33393E; overflow:hidden; }
#loader .bar i{ display:block; height:100%; width:0%; background:var(--mark); transition:width .15s linear; }
#loader .l-err{ color:#FFB4A8; max-width:420px; line-height:1.5; font-size:13px; }
#loader button{ border:0; background:var(--mark); color:var(--on-mark); padding:8px 16px; cursor:pointer; font-size:13px; font-weight:700; }

#cmp-labels{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.cmp-label{ position:absolute; transform:translate(-50%, 8px); text-align:center; pointer-events:auto; cursor:pointer; background:#fff; border:0; padding:5px 10px; color:#14171A; }
.cmp-label:hover{ background:var(--mark); }
.cmp-label b{ display:block; font-weight:800; font-stretch:75%; font-size:16px; }
.cmp-label span{ display:block; font-size:11.5px; color:#3A4147; margin-top:1px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.cmp-ruler{ position:absolute; transform:translate(-50%, -24px); font-size:12px; font-weight:600; color:#fff; white-space:nowrap; }

/* ---------- fiche ---------- */
#panel{ width:400px; flex:none; display:flex; flex-direction:column; min-height:0; background:var(--paper); }
#ptabs{ flex:none; display:flex; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule-2); }
.ptab{ flex:1; padding:11px 8px 10px; background:transparent; border:0; border-right:1px solid var(--rule); color:var(--ink-2); cursor:pointer; font-size:13px; font-weight:600; white-space:nowrap; }
.ptab:last-child{ border-right:0; }
.ptab:hover{ background:var(--sheet); }
.ptab[aria-selected="true"]{ background:var(--mark); color:var(--on-mark); }
.ptab .n{ font-weight:400; margin-left:5px; opacity:.7; font-variant-numeric:tabular-nums; }
.ptab.go{ text-decoration:underline; text-underline-offset:3px; }
#pbody{ flex:1; overflow-y:auto; padding:20px 22px calc(28px + env(safe-area-inset-bottom, 0px)); padding-right:max(22px, env(safe-area-inset-right, 0px)); -webkit-overflow-scrolling:touch; }
#pbody h2{ font-weight:800; font-stretch:75%; font-size:26px; line-height:1.05; margin:0; text-wrap:balance; }
.launch{ color:var(--mute); font-size:12.5px; margin-top:6px; line-height:1.5; }
.facts{ display:grid; grid-template-columns:1fr 1fr; margin-top:16px; border-top:2px solid var(--ink); border-left:1px solid var(--rule); }
.facts div{ padding:8px 10px 9px; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); min-width:0; }
.facts dt{ font-size:11.5px; color:var(--mute); }
.facts dd{ margin:2px 0 0; font-weight:700; font-stretch:75%; font-size:19px; line-height:1.15; font-variant-numeric:tabular-nums; }
.facts dd small{ font-size:12px; font-weight:500; font-stretch:100%; color:var(--ink-2); }
.desc{ font-size:14px; line-height:1.6; color:var(--ink); margin:16px 0 0; }
.where{ margin-top:16px; background:var(--sheet); border:1px solid var(--rule); padding:10px 10px 6px; }
.where svg{ width:100%; height:auto; display:block; }
.spec-section{ margin-top:24px; }
.spec-section-title{ font-weight:800; font-stretch:75%; font-size:16px; padding-bottom:5px; border-bottom:2px solid var(--ink); }
.spec-row{ display:flex; justify-content:space-between; gap:16px; padding:7px 0; border-bottom:1px solid var(--rule); font-size:13px; }
.spec-row .k{ color:var(--ink-2); flex:0 0 auto; max-width:44%; }
.spec-row .v{ text-align:right; font-weight:600; min-width:0; line-height:1.4; font-variant-numeric:tabular-nums; }
.source-note{ font-size:12px; line-height:1.55; color:var(--mute); margin-top:20px; }
.cta{ display:block; width:100%; margin-top:16px; padding:11px 14px; text-align:left; border:2px solid var(--ink); background:var(--sheet); color:var(--ink); font-weight:700; font-size:14px; cursor:pointer; }
.cta:hover{ background:var(--mark); color:var(--on-mark); }
.cta:hover small{ color:var(--on-mark); }
.cta small{ display:block; font-size:12px; color:var(--ink-2); margin-top:3px; font-weight:400; line-height:1.4; }

.parts-intro{ font-size:13px; color:var(--ink-2); line-height:1.55; margin:0 0 12px; }
.part{ border-bottom:1px solid var(--rule); }
.part:first-of-type{ border-top:2px solid var(--ink); }
.part > button{ display:flex; width:100%; align-items:center; gap:10px; text-align:left; padding:10px 8px; background:transparent; border:0; cursor:pointer; font-size:14px; font-weight:600; }
.part > button:hover{ background:var(--sheet); }
.part .dot{ width:9px; height:9px; border:1.5px solid var(--ink); flex:none; }
.part.on > button{ background:var(--mark); color:var(--on-mark); }
.part.on .dot{ background:var(--on-mark); border-color:var(--on-mark); }
.part .pd{ display:none; padding:10px 8px 14px 27px; font-size:13.5px; line-height:1.6; }
.part.on .pd{ display:block; }
.part .pf{ margin-top:10px; padding-top:8px; border-top:1px solid var(--rule); font-size:12.5px; line-height:1.7; font-weight:600; font-variant-numeric:tabular-nums; }
.cmp-table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:16px; }
.cmp-table th{ text-align:left; color:var(--mute); font-weight:500; padding:7px 6px 7px 0; border-bottom:2px solid var(--ink); font-size:12px; }
.cmp-table td{ padding:8px 6px 8px 0; border-bottom:1px solid var(--rule); font-variant-numeric:tabular-nums; }
.cmp-table td:first-child{ font-weight:700; }
.cmp-table tr[data-go]{ cursor:pointer; }
.cmp-table tr[data-go]:hover td{ background:var(--sheet); }
.barcell{ display:flex; align-items:center; gap:8px; white-space:nowrap; }
.barcell i{ display:block; height:8px; background:var(--ink); min-width:2px; }
.barcell i.alt{ background:var(--rule-2); }

#err-banner{ position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top, 0px)); transform:translateX(-50%); background:var(--bad); color:#fff; font-size:12.5px; padding:9px 13px; z-index:999; max-width:88vw; }

@media (max-width: 860px){
  #top{ flex-direction:column; gap:0; padding:0; }
  .brand{ padding:9px var(--gr) 8px var(--gl); }
  .brand h1{ font-size:18px; }
  #tabs{ margin-left:0; border-top:1px solid var(--rule); }
  .tab{ padding:9px 13px; font-size:13.5px; }
  .tab:first-child{ border-left:0; padding-left:var(--gl); }
  .tab small{ display:none; }
  .tab.theme{ padding:0 13px; }
  #main{ flex-direction:column; }
  #stage{ flex:0 0 46%; }
  #panel{ width:auto; flex:1; }
  #pbody{ padding-left:var(--gl); padding-right:var(--gr); }
  #hud-title{ top:10px; }
  #t-src, #hint{ display:none; }
  .tool span.lbl, .explode .lbl{ display:none; }
  .tool{ padding:0 11px; }
  .explode input{ width:84px; }
  #toolbar{ bottom:8px; }
  .cmp-label{ padding:3px 6px; } .cmp-label b{ font-size:13px; } .cmp-label span{ font-size:10px; }
}
@media (prefers-reduced-motion: reduce){ *{ transition-duration:.001ms !important; animation-duration:.001ms !important; } }

.plink{ display:inline-block; margin-top:10px; padding:0; border:0; background:transparent; font-size:13px; font-weight:700; text-decoration:underline; text-underline-offset:3px; cursor:pointer; color:var(--ink); }

/* ===== Instruments et données : un manuel d'instrument, sur toute la largeur ===== */
#inst-page{ position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; background:var(--paper); }
.inst-top{ display:flex; align-items:stretch; padding-left:var(--gl); padding-right:var(--gr); border-bottom:2px solid var(--ink); flex-wrap:wrap; }
.inst-back{ font-size:13px; font-weight:700; background:var(--sheet); color:var(--ink); border:2px solid var(--ink); padding:0 12px; margin:9px 16px 9px 0; height:30px; cursor:pointer; }
.inst-back:hover{ background:var(--mark); color:var(--on-mark); }
.inst-title{ font-weight:800; font-stretch:75%; font-size:21px; align-self:center; padding-block:10px; }
.pills{ display:flex; margin-left:auto; }
.pill{ border:0; border-left:1px solid var(--rule); background:transparent; color:var(--ink-2); font-size:14px; font-weight:600; padding:0 16px; cursor:pointer; }
.pill:last-child{ border-right:1px solid var(--rule); }
.pill:hover{ background:var(--sheet); }
.pill.on{ background:var(--mark); color:var(--on-mark); }
.inst-body{ flex:1; display:flex; min-height:0; }
.inst-nav{ width:232px; flex:none; border-right:1px solid var(--ink); overflow-y:auto; padding-left:env(safe-area-inset-left, 0px); }
.nav-i{ display:block; width:100%; text-align:left; padding:10px 14px 10px 12px; border:0; border-bottom:1px solid var(--rule); border-left:6px solid var(--c, transparent); background:transparent; cursor:pointer; }
.nav-i .n{ display:block; font-weight:700; font-size:14px; }
.nav-i .k{ display:block; font-size:12px; color:var(--mute); margin-top:1px; }
.nav-i:hover{ background:var(--sheet); }
.nav-i.on{ background:var(--mark); color:var(--on-mark); }
.nav-i.on .k{ color:var(--on-mark); opacity:.8; }
.inst-main{ flex:1; overflow-y:auto; padding:24px 32px calc(70px + env(safe-area-inset-bottom, 0px)); padding-right:max(32px, env(safe-area-inset-right, 0px)); min-width:0; -webkit-overflow-scrolling:touch; }
.inst-head{ padding-bottom:20px; border-bottom:2px solid var(--ink); display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.25fr); gap:8px 40px; align-items:end; }
.inst-h{ display:block; }
.inst-name{ font-weight:800; font-stretch:75%; font-size:clamp(30px, 4vw, 52px); line-height:.98; }
.inst-full{ color:var(--ink-2); font-size:14px; margin-top:8px; }
.kind{ display:inline-block; font-size:12.5px; font-weight:600; border:1.5px solid var(--ink); padding:1px 8px; margin-top:10px; }
.inst-sum{ font-size:15px; line-height:1.6; margin:0; max-width:72ch; }
.inst-range{ display:flex; gap:6px 18px; flex-wrap:wrap; margin-top:12px; }
.rng{ font-size:13px; padding-left:8px; border-left:6px solid var(--c); color:var(--ink-2); font-variant-numeric:tabular-nums; }
.rng b{ color:var(--ink); font-weight:700; }
.inst-cols{ columns:2 440px; column-gap:40px; }
.isec{ padding-top:24px; break-inside:avoid; }
.isec.wide{ column-span:all; }
.isec h4{ font-weight:800; font-stretch:75%; font-size:17px; margin:0 0 10px; padding-bottom:5px; border-bottom:2px solid var(--ink); }
.cap{ font-size:12px; color:var(--mute); margin-top:8px; line-height:1.5; }
.stable .srow{ display:flex; gap:18px; padding:7px 0; border-bottom:1px solid var(--rule); font-size:13px; }
.stable .k{ flex:0 0 36%; color:var(--ink-2); }
.stable .v{ flex:1; min-width:0; font-weight:600; line-height:1.45; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.codewrap{ position:relative; }
pre.code{ margin:0; padding:14px 16px; background:#0B0D0F; color:#E4E7E9; overflow-x:auto; font:12px/1.6 var(--f-code); }
.copy{ position:absolute; top:0; right:0; font-size:11.5px; font-weight:700; color:#14171A; background:#fff; border:0; padding:4px 9px; cursor:pointer; }
.copy:hover{ background:var(--mark); }
.ex-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
.ex-title{ font-size:13px; font-weight:600; }
.tag{ font-size:11.5px; font-weight:700; padding:1px 7px; white-space:nowrap; }
.tag.real{ background:var(--ok); color:#fff; }
.tag.illus{ border:1.5px solid var(--warn); color:var(--warn); }
.chips{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px; }
.chip{ font-size:12px; font-weight:600; padding:3px 7px; border:1px solid var(--rule-2); background:transparent; cursor:pointer; font-variant-numeric:tabular-nums; }
.chip:hover{ background:var(--sheet); border-color:var(--ink); }
.chip.on{ background:var(--mark); border-color:var(--mark); color:var(--on-mark); }
.filter-detail{ margin-top:10px; font-size:13px; min-height:20px; }
.filter-detail b{ font-weight:800; background:var(--mark); color:var(--on-mark); padding:0 4px; }
.svgwrap{ overflow-x:auto; }
svg.cov, svg.mini, svg.optic{ width:100%; min-width:400px; height:auto; display:block; }
ol.notes{ padding-left:20px; }
.fov-leg li:not([data-inst]):not([data-jump]){ cursor:default; font-weight:400; }
.cov-row{ cursor:pointer; }
.cov-lab{ fill:var(--ink); font:600 12.5px Archivo, Arial, sans-serif; }
.cov-row.sel .cov-lab{ font-weight:800; text-decoration:underline; }
.cov-row:hover .cov-lab{ text-decoration:underline; }
.cov-band{ fill:#fff; font:700 10.5px Archivo, Arial, sans-serif; pointer-events:none; }
.cov-tick{ fill:var(--ink-2); font:11px Archivo, Arial, sans-serif; }
.cov-grid{ stroke:var(--rule); stroke-width:1; }
.cov-axis{ stroke:var(--ink); stroke-width:1.5; }
.cov-unit{ fill:var(--mute); font:11px Archivo, Arial, sans-serif; }
.cov-vis{ fill:var(--ink-2); font:11px Archivo, Arial, sans-serif; }
.fov{ display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start; }
.fov-svg{ width:300px; max-width:100%; height:auto; }
.fov-svg [data-inst]{ cursor:pointer; }
.fov-leg{ list-style:none; margin:0; padding:0; font-size:13px; min-width:190px; flex:1; }
.fov-leg li{ display:flex; align-items:center; gap:8px; padding:6px 0; cursor:pointer; border-bottom:1px solid var(--rule); }
.fov-leg li:hover, .fov-leg li.sel{ font-weight:700; }
.fov-leg i{ width:11px; height:11px; flex:none; }
.fov-leg span{ margin-left:auto; padding-left:12px; color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums; }
.fov-bar{ stroke:var(--ink); stroke-width:2; }
.fov-barlab{ fill:var(--ink-2); font:11px Archivo, Arial, sans-serif; }
.archs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); border-top:1px solid var(--rule); border-left:1px solid var(--rule); }
.arch{ display:block; padding:12px 14px; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); text-decoration:none; color:var(--ink); }
.arch:hover{ background:var(--sheet); }
.a-l{ display:block; font-weight:700; font-size:14px; text-decoration:underline; text-underline-offset:3px; }
.a-d{ display:block; color:var(--ink-2); font-size:12.5px; line-height:1.5; margin-top:4px; }
.a-u{ display:block; color:var(--mute); font-size:12px; margin-top:6px; }
.icards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:0; border-top:1px solid var(--rule); border-left:1px solid var(--rule); }
.icard{ text-align:left; padding:10px 12px 12px; background:transparent; border:0; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); border-top:6px solid var(--c); cursor:pointer; }
.icard:hover{ background:var(--sheet); }
.ic-n{ display:block; font-weight:800; font-stretch:75%; font-size:19px; }
.ic-k{ display:block; color:var(--ink-2); font-size:12.5px; margin-top:2px; }
.ic-r{ display:block; font-size:12.5px; font-weight:600; margin-top:8px; font-variant-numeric:tabular-nums; }
.notes{ margin:0; padding-left:18px; font-size:13.5px; line-height:1.6; }
.notes li{ margin-bottom:6px; }
.lnks{ display:flex; flex-direction:column; }
.lnk{ display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px solid var(--rule); color:var(--ink); font-size:13.5px; font-weight:600; text-underline-offset:3px; }
.lnk em{ font-style:normal; font-weight:400; font-size:12.5px; color:var(--mute); text-decoration:none; white-space:nowrap; }
@media (max-width: 860px){
  .inst-top{ padding:0; }
  .inst-back{ margin:9px 12px 9px var(--gl); }
  .inst-title{ font-size:17px; }
  .pills{ margin-left:0; width:100%; border-top:1px solid var(--rule); overflow-x:auto; }
  .pill{ padding:9px 14px; } .pill:first-child{ border-left:0; padding-left:var(--gl); }
  .inst-body{ flex-direction:column; }
  .inst-nav{ width:auto; display:flex; overflow-x:auto; overflow-y:hidden; border-right:0; border-bottom:1px solid var(--ink); flex:none; padding-left:0; }
  .nav-i{ flex:none; width:auto; white-space:nowrap; border-bottom:0; border-left:0; border-top:5px solid var(--c, transparent); border-right:1px solid var(--rule); padding:7px 13px 9px; }
  .nav-i:first-child{ padding-left:var(--gl); }
  .nav-i .k{ display:none; }
  .inst-main{ padding:18px var(--gr) calc(60px + env(safe-area-inset-bottom, 0px)) var(--gl); }
  .inst-head{ grid-template-columns:minmax(0, 1fr); gap:14px; }
  .inst-cols{ columns:1; }
  .stable .srow{ flex-direction:column; gap:2px; }
  .stable .k{ flex:none; }
}

/* comparaison entre observatoires */
.cmp-figs{ display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px 40px; }
.cmp-figs h5{ font-size:13px; font-weight:700; margin:0 0 8px; }
.obs-key{ display:flex; flex-wrap:wrap; gap:6px 18px; margin:0 0 10px; padding:0; list-style:none; font-size:13px; font-weight:600; }
.obs-key i{ display:inline-block; width:11px; height:11px; margin-right:6px; vertical-align:-1px; }
svg.cov.big{ min-width:640px; }
.cov-obs{ fill:var(--ink); font:800 13px Archivo, Arial, sans-serif; font-stretch:75%; }
.cov-reg{ fill:var(--mute); font:11px Archivo, Arial, sans-serif; }
.cov-sep{ stroke:var(--ink); stroke-width:1; }
.tablewrap{ overflow-x:auto; }
.ctable{ width:100%; border-collapse:collapse; font-size:13px; min-width:720px; }
.ctable th{ text-align:left; font-size:12px; font-weight:500; color:var(--mute); padding:6px 14px 6px 0; border-bottom:2px solid var(--ink); white-space:nowrap; }
.ctable td{ padding:7px 14px 7px 0; border-bottom:1px solid var(--rule); vertical-align:top; font-variant-numeric:tabular-nums; }
.ctable td.o{ font-weight:800; font-stretch:75%; font-size:15px; white-space:nowrap; border-left:6px solid var(--c); padding-left:8px; }
.ctable td.n{ font-weight:700; white-space:nowrap; }
.ctable tr[data-jump]{ cursor:pointer; }
.ctable tr[data-jump]:hover td{ background:var(--sheet); }
.ctable tr.first td{ border-top:1px solid var(--ink); }

/* observations réelles */
.real-img{ display:block; width:100%; height:auto; background:#000; }

/* orbites */
canvas.orb{ display:block; width:100%; max-width:560px; height:auto; background:var(--sheet); border:1px solid var(--rule); }
.orb-ctl{ display:flex; align-items:center; gap:12px; margin-top:8px; min-height:26px; }
.orb-read{ font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }

.real-item + .real-item{ margin-top:26px; padding-top:18px; border-top:1px solid var(--rule); }
.real-meta{ margin-top:10px; }
.real-meta summary{ cursor:pointer; font-size:13px; font-weight:600; padding:4px 0; }
.real-meta .lnks{ margin-top:4px; }
.orb-key{ display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; font-weight:600; margin:0 0 10px; padding:0; list-style:none; }
.orb-key i{ display:inline-block; width:11px; height:11px; margin-right:6px; vertical-align:-1px; }

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <h1>Observatoires en orbite</h1>
    </div>
    <nav id="tabs" role="tablist" aria-label="Observatoire"></nav>
  </header>

  <div id="main">
    <section id="stage" aria-label="Vue 3D">
      <div class="hud" id="hud-title">
        <div id="t-name"></div>
        <div id="t-sub"></div>
        <div id="t-src"></div>
      </div>
      <div id="cmp-labels" hidden></div>
      <div id="callout" hidden></div>
      <div id="hover-tip" hidden></div>
      <div id="hint">Glisser pour tourner, molette pour zoomer, cliquer une pièce pour l'identifier</div>

      <div id="toolbar" role="toolbar" aria-label="Affichage">
        <label class="explode" title="Écarter les pièces">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5.5" y="5.5" width="5" height="5"/><path d="M8 3.6V1M8 15v-2.6M3.6 8H1M15 8h-2.6"/></svg>
          <span class="lbl">Éclater</span>
          <input id="explode" type="range" min="0" max="100" value="0" aria-label="Éclater les pièces">
        </label>
        <span class="tool-sep"></span>
        <button class="tool" id="b-sun" aria-pressed="false" title="Éclairer la maquette comme elle l'est réellement en vol">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.8"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/></svg>
          <span class="lbl">Soleil réel</span>
        </button>
        <button class="tool" id="b-spin" aria-pressed="true" title="Rotation automatique">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-4"/><path d="M12.4 1.4v3h-3"/></svg>
          <span class="lbl">Rotation</span>
        </button>
        <button class="tool" id="b-reset" title="Recadrer la vue">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 5.5v-4h4M14.5 5.5v-4h-4M1.5 10.5v4h4M14.5 10.5v4h-4"/></svg>
          <span class="lbl">Recadrer</span>
        </button>
      </div>

      <div id="loader" hidden>
        <div class="l-title"></div>
        <div class="bar"><i></i></div>
        <div class="l-sub"></div>
        <div class="l-err" hidden></div>
        <button id="l-retry" hidden>Réessayer</button>
      </div>
    </section>

    <aside id="panel">
      <div id="ptabs" role="tablist"></div>
      <div id="pbody"></div>
    </aside>
  </div>

  <div id="inst-page" hidden>
    <div class="inst-top">
      <button class="inst-back" id="inst-close">Retour à la vue 3D</button>
      <div class="inst-title">Instruments et données</div>
      <div class="pills" id="inst-pills"></div>
    </div>
    <div class="inst-body">
      <nav class="inst-nav" id="inst-nav"></nav>
      <div class="inst-main" id="inst-main"></div>
    </div>
  </div>
</div>

/* =================================================================
   TRAJET DE LA LUMIÈRE (lot D des specs) — schémas optiques et plans focaux.
   Chaque figure dit ce qui est à l'échelle et ce qui est un schéma de principe.
   Couleurs neutres : ramenées aux jetons du thème par les règles « svg [fill=…] » de style.css.
================================================================= */
var Optics = (function(){
  var INK = '#14171A', MID = '#3A4147', SOFT = '#98A1A7', RAY = '#DB5A14', DET = '#3D6BE0';
  function f(n){ return Math.round(n*10)/10; }
  function L(x1,y1,x2,y2,c,w,d){ return '<line x1="'+f(x1)+'" y1="'+f(y1)+'" x2="'+f(x2)+'" y2="'+f(y2)+'" stroke="'+c+'" stroke-width="'+(w||1)+'"'+(d?' stroke-dasharray="'+d+'"':'')+' stroke-linecap="round"/>'; }
  function P(pts,c,w,d){ return '<polyline points="'+pts.map(function(p){ return f(p[0])+','+f(p[1]); }).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="'+(w||1)+'"'+(d?' stroke-dasharray="'+d+'"':'')+' stroke-linejoin="round" stroke-linecap="round"/>'; }
  function T(x,y,s,a,b){ return '<text x="'+f(x)+'" y="'+f(y)+'" fill="'+(b?INK:MID)+'" font-size="'+(b?12:11)+'" font-weight="'+(b?700:400)+'" font-family="Archivo, Arial, sans-serif"'+(a?' text-anchor="'+a+'"':'')+'>'+s+'</text>'; }
  function dim(x1,x2,y,s){ return L(x1,y,x2,y,MID,1) + L(x1,y-4,x1,y+4,MID,1) + L(x2,y-4,x2,y+4,MID,1) + T((x1+x2)/2, y-6, s, 'middle'); }
  function svg(w,h,body,label){ return '<div class="svgwrap"><svg class="optic" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+label+'">'+body+'</svg></div>'; }

  /* télescope à deux miroirs dans l'axe : primaire en z = 0, ciel à gauche. Unités : mètres. */
  function twoMirror(o){
    var W = 560, k = (W-40)/(o.z1-o.z0), H = Math.round(2*o.half*k + 70), cy = H/2 + 4;
    function X(z){ return 20 + (z-o.z0)*k; } function Y(r){ return cy - r*k; }
    function sag(h){ return -h*h/(2*o.R); }
    var s = '';
    if (o.tube) s += P(o.tube.map(function(p){ return [X(p[0]), Y(p[1])]; }), SOFT, 1, '4 3') + P(o.tube.map(function(p){ return [X(p[0]), Y(-p[1])]; }), SOFT, 1, '4 3');
    [1,-1].forEach(function(sg){
      var pts = []; for (var i=0;i<=8;i++){ var h = o.hole + (o.r1-o.hole)*i/8; pts.push([X(sag(h)), Y(sg*h)]); }
      s += P(pts, INK, 4);
    });
    s += L(X(-o.d), Y(o.r2), X(-o.d), Y(-o.r2), INK, 4);
    o.rays.forEach(function(h){
      [1,-1].forEach(function(sg){
        var h2 = h*o.r2/o.r1*0.92;
        s += P([[X(o.z0), Y(sg*h)], [X(sag(h)), Y(sg*h)], [X(-o.d), Y(sg*h2)], [X(o.focus[0]), Y(o.focus[1])]], RAY, 1.2);
      });
    });
    s += (o.after ? o.after(X, Y, k) : '');
    s += T(X(o.z0)+2, 14, 'lumière du ciel', null) + L(X(o.z0)+2, 22, X(o.z0)+46, 22, MID, 1) + '<path d="M'+f(X(o.z0)+46)+' 22 l-7 -4 v8 z" fill="'+MID+'"/>';
    s += dim(X(-o.d), X(0), H-12, o.dLabel);
    return svg(W, H, s, o.label);
  }

  var FIG = {
    hubble: function(){
      return twoMirror({ z0:-9.2, z1:4.2, half:2.25, R:11.04, r1:1.2, hole:0.3, r2:0.15, d:4.9, rays:[1.2, 0.62], focus:[1.5, 0], dLabel:'4,9 m',
        label:'Schéma optique de Hubble, à l\'échelle',
        tube:[[-9,1.55],[-0.4,1.55],[-0.4,2.1],[3.7,2.1],[3.7,0]],
        after:function(X, Y){
          return L(X(1.5), Y(0.22), X(1.5), Y(-0.22), DET, 4) +
            T(X(0.05)+8, Y(1.2)-4, 'Miroir primaire, 2,4 m', null, true) + T(X(-4.9), Y(0.15)-10, 'Miroir secondaire, 0,3 m', 'middle', true) +
            T(X(1.5)+8, Y(0)+4, 'Foyer', null, true) + T(X(1.5)+8, Y(0)+18, '1,5 m derrière', null) + T(X(1.5)+8, Y(0)+31, 'le primaire', null);
        } });
    },
    jwst: function(){
      return twoMirror({ z0:-8.3, z1:3.2, half:3.6, R:16.2, r1:3.25, hole:0.66, r2:0.37, d:7.17, rays:[3.25, 1.7], focus:[-1.55, 0], dLabel:'7,2 m',
        label:'Schéma optique de JWST',
        after:function(X, Y){
          var s = '<rect x="'+f(X(-2.0))+'" y="'+f(Y(0.55))+'" width="'+f(X(-0.1)-X(-2.0))+'" height="'+f(Y(-0.55)-Y(0.55))+'" fill="none" stroke="'+SOFT+'" stroke-dasharray="4 3"/>';
          s += '<rect x="'+f(X(0.5))+'" y="'+f(Y(1.9))+'" width="'+f(X(2.9)-X(0.5))+'" height="'+f(Y(-1.9)-Y(1.9))+'" fill="none" stroke="'+SOFT+'" stroke-dasharray="4 3"/>';
          s += P([[X(-1.55), Y(0)], [X(-0.25), Y(0.3)], [X(-1.2), Y(-0.28)], [X(1.6), Y(-0.9)]], RAY, 1.2) + P([[X(-1.55), Y(0)], [X(-0.25), Y(-0.05)], [X(-1.2), Y(-0.4)], [X(1.6), Y(-0.9)]], RAY, 1.2);
          s += L(X(-0.25), Y(0.42), X(-0.25), Y(-0.16), INK, 4) + L(X(-1.2), Y(-0.2), X(-1.2), Y(-0.48), INK, 4) + L(X(1.6), Y(-0.6), X(1.6), Y(-1.2), DET, 4);
          s += T(X(0)+12, Y(3.25)+2, 'Miroir primaire, 6,5 m', null, true) + T(X(-7.17)+2, Y(-0.37)+26, 'Miroir secondaire, 0,74 m', null, true);
          s += T(X(-2.0), Y(0.55)-20, 'Optique arrière', null, true) + T(X(-2.0), Y(0.55)-7, 'tertiaire et pointage fin', null) + T(X(1.7), Y(1.9)-7, 'Module d\'instruments', 'middle', true) + T(X(1.6)+9, Y(-0.9)+4, 'Plan focal', null);
          return s;
        } });
    },
    euclid: function(){
      return twoMirror({ z0:-2.6, z1:1.9, half:0.95, R:5.2, r1:0.6, hole:0.11, r2:0.175, d:1.756, rays:[0.6, 0.3], focus:[0.42, 0], dLabel:'1,756 m',
        label:'Schéma optique d\'Euclid',
        tube:[[-2.45,0.75],[-0.05,0.75]],
        after:function(X, Y){
          var s = P([[X(0.42), Y(0)], [X(0.7), Y(0)], [X(0.7), Y(-0.5)], [X(1.15), Y(-0.5)], [X(1.15), Y(0.1)], [X(1.6), Y(0.1)]], RAY, 1.2);
          s += P([[X(1.15), Y(0.1)], [X(1.15), Y(0.62)]], RAY, 1.2);
          s += L(X(0.63), Y(0.07), X(0.77), Y(-0.07), INK, 4) + L(X(0.63), Y(-0.43), X(0.77), Y(-0.57), INK, 4) + L(X(1.08), Y(-0.57), X(1.22), Y(-0.43), INK, 4);
          s += L(X(1.08), Y(0.03), X(1.22), Y(0.17), MID, 2.5) + L(X(1.02), Y(0.62), X(1.28), Y(0.62), DET, 4) + L(X(1.6), Y(0.23), X(1.6), Y(-0.03), DET, 4);
          s += T(X(0)-8, Y(0.6)-8, 'Miroir primaire, 1,2 m', 'end', true) + T(X(-1.756), Y(0.175)-10, 'Miroir secondaire, 0,35 m', 'middle', true);
          s += T(X(1.15), Y(0.62)-8, 'VIS', 'middle', true) + T(X(1.6)+7, Y(0.1)+4, 'NISP', null, true) + T(X(1.28), Y(0.1)-12, 'lame dichroïque', null) + T(X(0.95), Y(-0.5)+24, 'renvois et miroir tertiaire', 'middle');
          return s;
        } });
    },
    gaia: function(){
      var W = 560, H = 330, cx = 280, cy = 158, r = 112, a = 53.25*Math.PI/180, s = '';
      s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+SOFT+'" stroke-width="10" opacity="0.5"/>';
      [[-1, RAY, 'Télescope 1'], [1, '#9A52D6', 'Télescope 2']].forEach(function(t){
        var sg = t[0], c = t[1], dx = sg*Math.sin(a), dy = -Math.cos(a);
        var m1 = [cx - dx*r, cy - dy*r], far = [cx + dx*(r+78), cy + dy*(r+78)], px = -dy, py = dx;
        [-22, 22].forEach(function(o){ s += L(far[0]+px*o, far[1]+py*o, m1[0]+px*o, m1[1]+py*o, c, 1.2); });
        s += L(m1[0]+px*30, m1[1]+py*30, m1[0]-px*30, m1[1]-py*30, INK, 4);
        var m2 = [cx + dx*r*0.72, cy + dy*r*0.72], m3 = [cx - dx*r*0.55, cy - dy*r*0.55 + 4], m4 = [cx + sg*9, cy - 54];
        s += P([[m1[0]+px*22, m1[1]+py*22], m2, m3, m4], c, 1.2) + P([[m1[0]-px*22, m1[1]-py*22], m2], c, 1.2);
        s += L(m2[0]+px*9, m2[1]+py*9, m2[0]-px*9, m2[1]-py*9, INK, 4) + L(m3[0]+px*11, m3[1]+py*11, m3[0]-px*11, m3[1]-py*11, INK, 4);
        s += P([m4, [cx, cy - 6], [cx + 46, cy + 30], [cx, cy + r - 4]], c, 1.2);
        s += T(far[0] + sg*4, far[1] - 8, t[2], sg < 0 ? 'start' : 'end', true);
        s += T(m1[0] + sg*-0 + (sg < 0 ? 14 : -14), m1[1] + 30, sg < 0 ? 'M1' : 'M1′', sg < 0 ? 'start' : 'end');
      });
      s += L(cx - 16, cy - 54, cx + 16, cy - 54, INK, 4) + L(cx - 9, cy - 6, cx + 9, cy - 6, INK, 4) + L(cx + 40, cy + 22, cx + 52, cy + 38, INK, 4) + L(cx - 34, cy + r - 4, cx + 34, cy + r - 4, DET, 5);
      s += T(cx, cy - 64, 'combineur de faisceaux', 'middle') + T(cx, cy + r + 16, 'Plan focal commun, 106 CCD', 'middle', true);
      s += T(cx, 16, 'angle entre les deux lignes de visée : 106,5°', 'middle');
      return svg(W, H, s, 'Schéma optique de Gaia, vue de dessus');
    }
  };

  /* ---------- champs de vue à l'échelle ---------- */

  /* ---------- filtres ---------- */

    var f = it.filters[idx], det = '';

  /* ---------- observations réelles (lot E) : data/manifest.json est produit par tools/data/fetch_data.py ---------- */

  /* ---------- comparaison entre observatoires ---------- */

  function cmpCoverage(){

function route(){
  var h = (location.hash || '').replace(/^#/, ''), inst = false, mode = 'tele', id = S.id;
  if (/-instruments$/.test(h)){ inst = true; h = h.replace(/-instruments$/, ''); }
  if (h === 'comparer') mode = 'compare'; else if (tele(h)) id = h;
  var changed = id !== S.id || mode !== S.mode;
  if (id !== S.id){ S.instSel = null; S.filterIdx = 0; }
  if (S.pendingInst){ if (mode === 'tele'){ S.instSel = S.pendingInst; S.filterIdx = 0; } S.pendingInst = null; }
  S.id = id; S.mode = mode; S.inst = inst;
  if (changed){ S.part = null; S.hover = null; S.ptab = 'fiche'; }
  renderTabs(); renderHud(); renderPanel();
  $('inst-page').hidden = !S.inst;
  if (S.inst) renderInst();
  if (renderer) show3D(changed);
  consumePart();
}

function fetchModel(t, onProgress){
  if (buffers[t.id]) return buffers[t.id];
  var raw = !/\.txt$/.test(t.file);
  var p = fetch(t.file).then(function(res){
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var total = +res.headers.get('content-length') || t.bytes;

      chunks.push(r.value); got += r.value.length; if (p.onProgress) p.onProgress(got, Math.max(total, got)); return pump();
    }); }
    return pump();
  });
  p.onProgress = onProgress;
  p.catch(function(){ delete buffers[t.id]; });

function tweakMaterial(id, m){

    if (/TopReflector|mirror|gold-nofoil|JWST-gold/.test(n)){ m.color.setRGB(1.0, 0.74, 0.32); m.metalness = 0.88; m.roughness = 0.3; }
    else if (/FoilLayer[1-4]/.test(n)){ m.color.setRGB(0.42, 0.44, 0.50); m.metalness = 0.9; m.roughness = 0.45; }
    else if (/PURPLEY/.test(n)){ m.metalness = 0.75; m.roughness = 0.36; }
    else if (/silver/.test(n)){ m.metalness = 0.9; m.roughness = 0.34; }
    else if (/SolarPanel/.test(n)){ m.metalness = 0.4; m.roughness = 0.32; }
    else if (/black/.test(n)){ m.roughness = 0.7; m.metalness = 0.2; }

  } else if (id === 'gaia'){
    if (/Gold|Aluminum|Metal/.test(n)){ m.metalness = Math.max(m.metalness, 0.75); m.roughness = Math.min(m.roughness, 0.45); }

canvas.addEventListener('webglcontextlost', function(e){ e.preventDefault(); banner('Le contexte graphique a été perdu. Recharger la page pour retrouver la vue 3D.'); });

window.__obs = { S:S, C:C, models:models, cmp:cmp, pick:pick, camera:camera, get current(){ return current; } };
route();
requestAnimationFrame(tick);
})();
